name: Deploy LanaAPI to Chapiritas

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy API
    runs-on: ubuntu-latest

    steps:
      # 1) Obtener el código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Configurar la llave SSH en ~/.ssh/id_ed25519
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          # Escribe aquí tu clave privada en un fichero llamado id_ed25519
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Añade la huella del host para que no pregunte
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # 3) Conectar por SSH y desplegar usando root
      - name: SSH Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              root@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            # 3.1. Ir al directorio donde está tu repo bajo root
            cd /root/lana-api

            # 3.2. Sincronizar con main
            git fetch --all
            git reset --hard origin/main

            # 3.3. Activar virtualenv e instalar deps
            source .venv/bin/activate
            pip install --upgrade -r requirements.txt

            # 3.4. Reiniciar tu servicio systemd de FastAPI
            systemctl restart lana-api

            # 3.5. Validar y recargar Nginx
            nginx -t && systemctl reload nginx
          EOF
